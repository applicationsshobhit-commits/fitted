<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitted Design Renders</title>
<style>
  body{margin:0;background:#eef2f1;font:15px/1.5 system-ui,sans-serif;color:#172124;padding:20px}
  #status{font:12px ui-monospace,monospace;color:#55666a}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
  figure{margin:0;background:#f9fbfa;border:1px solid #d2dcda;border-radius:8px;padding:10px}
  figure img{width:100%;display:block}
  figcaption{font-size:13px;color:#55666a}
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js" } }</script>
</head>
<body>
<div id="status">loading</div>
<div class="grid" id="grid"></div>
<script type="module">
// Renders exactly the geometry the STL exporter writes, from design/out/params.json.
import * as THREE from 'three';
import { builtUpGeometry, bulbGeometry, cuffGeometries } from '/design/designs.js';

const TPU = () => new THREE.MeshStandardMaterial({ color: 0x2f9a8a, roughness: 0.7, side: THREE.DoubleSide });
const STEEL = () => new THREE.MeshStandardMaterial({ color: 0xa9b3b6, roughness: 0.3, metalness: 0.8, side: THREE.DoubleSide });
const GHOST = () => new THREE.MeshStandardMaterial({ color: 0xd8c3ac, roughness: 0.9, transparent: true, opacity: 0.4, depthWrite: false });

// A dessert spoon in millimetres, handle along +X from x = 0, bowl toward −X.
// The neck can bend upward for the palm bulb.
function spoon(bendDeg = 0) {
  const g = new THREE.Group(), m = STEEL();
  const handle = new THREE.Mesh(new THREE.BoxGeometry(120, 2.5, 10), m); handle.position.x = 60;
  const front = new THREE.Group();
  const neck = new THREE.Mesh(new THREE.BoxGeometry(32, 2.5, 7), m); neck.position.x = -16;
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), m);
  bowl.scale.set(24, 8, 16); bowl.position.set(-54, 3, 0);
  front.add(neck, bowl);
  front.rotation.z = -bendDeg * Math.PI / 180;
  g.add(handle, front);
  return g;
}

function shadow() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), grd = x.createRadialGradient(64, 64, 4, 64, 64, 62);
  grd.addColorStop(0, 'rgba(20,35,33,0.22)'); grd.addColorStop(1, 'rgba(20,35,33,0)');
  x.fillStyle = grd; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

const builders = {
  'built-up-grip': p => {
    const g = new THREE.Group();
    g.add(spoon());
    const grip = new THREE.Mesh(builtUpGeometry(p.builtUp), TPU()); grip.position.x = 12;
    g.add(grip);
    return g;
  },
  'universal-cuff': p => {
    const g = new THREE.Group();
    const { bandGeo, pocketGeo } = cuffGeometries(p.cuff);
    g.add(new THREE.Mesh(bandGeo, TPU()), new THREE.Mesh(pocketGeo, TPU()));
    const py = -(p.cuff.palmThickness / 2 + p.cuff.wall) - (p.cuff.slotHeight + 5) / 2 + 1;
    const s = spoon(); s.rotation.y = Math.PI; s.scale.setScalar(0.9); s.position.set(30, py, 0);
    g.add(s);
    const palm = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), GHOST());
    palm.scale.set(p.cuff.palmWidth / 2 - 0.5, p.cuff.palmThickness / 2 - 0.5, 55); palm.position.z = 12;
    g.add(palm);
    return g;
  },
  'palm-bulb': p => {
    const g = new THREE.Group();
    g.add(spoon(p.bulb.neckAngle));
    const bulb = new THREE.Mesh(bulbGeometry(p.bulb), TPU()); bulb.position.x = 6;
    g.add(bulb);
    return g;
  },
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
const SHADOW = shadow();

function shot(obj, { w = 1200, h = 900, dir = [1.3, 1.0, 1.95] } = {}) {
  renderer.setSize(w, h);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a98, 2.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(200, 300, 250); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(-250, 150, -200); scene.add(rim);
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size.x * 1.4 + 20, size.z * 1.8 + 40), new THREE.MeshBasicMaterial({ map: SHADOW, transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(mid.x, box.min.y - 0.5, mid.z); scene.add(floor);
  const sphere = box.getBoundingSphere(new THREE.Sphere()), fov = 28;
  const cam = new THREE.PerspectiveCamera(fov, w / h, 1, 5000);
  cam.position.copy(sphere.center).add(new THREE.Vector3(...dir).normalize().multiplyScalar(sphere.radius / Math.sin(fov / 2 * Math.PI / 180) * 1.02));
  cam.lookAt(sphere.center);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}

const src = new URLSearchParams(location.search).get('src') || '/design/out/params.json';
const { params } = await fetch(src, { cache: 'no-store' }).then(r => r.json());
const shots = {};
for (const [name, build] of Object.entries(builders)) {
  shots[name] = shot(build(params), name === 'universal-cuff' ? { dir: [1.2, 1.1, 1.7] } : {});
  const fig = document.createElement('figure');
  fig.innerHTML = `<img alt="${name}" src="${shots[name]}"><figcaption>${name}</figcaption>`;
  document.getElementById('grid').append(fig);
}

window.saveRenders = async () => {
  const out = {};
  for (const [name, data] of Object.entries(shots)) {
    out[name] = (await fetch(`/design/out/${name}.png`, { method: 'POST', body: data })).ok;
  }
  return out;
};
document.getElementById('status').textContent = 'ready';
</script>
</body>
</html>
